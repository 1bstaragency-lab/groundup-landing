[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[functions."scheduled-texts"]
  schedule = "0 14 * * 0,3"

# Hourly check-in dispatcher — fires once per hour at :00.
# Each invocation filters users to those whose checkin_hour in their timezone
# matches the current hour, so daily check-ins fire at the user's local time.
[functions."up-checkin"]
  schedule = "0 * * * *"

# Poll Blooio for inbound messages every minute — fallback for webhook delivery issues
[functions."blooio-poller"]
  schedule = "* * * * *"

# Short-link redirector — groundupapp.com/go/:code → function handles redirect
[[redirects]]
  from   = "/go/:code"
  to     = "/.netlify/functions/go/:code"
  status = 200

# Serve vCard at a .vcf URL so iOS recognizes it as a contact
[[redirects]]
  from   = "/up.vcf"
  to     = "/.netlify/functions/up-vcard"
  status = 200
